name: Production deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY engineering-desk to authorize a production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SITE_INDEXING_ENABLED: "true"

jobs:
  confirmation:
    name: Validate production dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Require main and exact deployment confirmation
        env:
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployments may only be dispatched from main."
            exit 1
          fi

          if [ "$DEPLOYMENT_CONFIRMATION" != "DEPLOY engineering-desk" ]; then
            echo "::error::Type exactly DEPLOY engineering-desk to continue."
            exit 1
          fi

  build-production:
    name: Build and verify production artifact
    needs: confirmation
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOYMENT_ENV: production
      SITE_URL: https://gracious.diftrak.com
      SITE_PRODUCTION_BRANCH: main
    steps:
      - name: Checkout confirmed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test production verifiers
        run: pnpm run test:production-verifier

      - name: Build static production export
        run: pnpm run build --webpack

      - name: Verify production artifact before approval
        run: pnpm exec node scripts/verify-pages-production.mjs --artifact-only

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: engineering-desk-production-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy to Cloudflare Pages production
    needs: build-production
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY engineering-desk' && needs.build-production.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gracious.diftrak.com
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout confirmed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install pinned Wrangler
        run: pnpm install --frozen-lockfile

      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: engineering-desk-production-${{ github.sha }}
          path: out/

      - name: Reverify production artifact
        run: pnpm exec node scripts/verify-pages-production.mjs --artifact-only

      - name: Verify production Cloudflare credentials and project
        env:
          CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_PRODUCTION_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
        run: node scripts/verify-cloudflare-production-project.mjs

      - name: Check pinned Wrangler version
        run: |
          set -euo pipefail
          if [ "$(pnpm exec wrangler --version)" != "4.160.0" ]; then
            echo "::error::The deployment must use the repository-pinned Wrangler 4.160.0."
            exit 1
          fi

      - name: Deploy verified production artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy out
          --project-name=engineering-desk
          --branch=main

      - name: Verify deployed production site
        env:
          PRODUCTION_VERIFY_BASE_URL: https://gracious.diftrak.com
        run: pnpm exec node scripts/verify-pages-production.mjs
